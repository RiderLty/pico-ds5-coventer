name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and release (v*)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: usb-pico2
            args: '--usb'
          - variant: bluetooth-pico2w
            args: '--pico2w'
          - variant: bluetooth-waveshare-rp2350b-plus-w
            args: '--waveshare'
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" == v* ]] || { echo 'Release tag must start with v'; exit 1; }
          git check-ref-format "refs/tags/$RELEASE_TAG"
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Build firmware
        env:
          BUILD_TYPE: Release
          TUSB_DEBUG_LEVEL: '0'
          DEBUG_BAUDRATE: '4000000'
          CMAKE_GENERATOR: Ninja
          BUILD_ARGS: ${{ matrix.args }}
        run: ./build.sh $BUILD_ARGS --build-dir build
      - name: Test Bluetooth report and lifecycle handling
        if: startsWith(matrix.variant, 'bluetooth-')
        run: python3 tools/test_ds5_bt.py
      - name: Prepare release assets
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p release-assets
          for ext in uf2 elf bin; do
            cp "build/src/pico-ds5-coventer.${ext}" \
              "release-assets/pico-ds5-coventer-${RELEASE_TAG}-${VARIANT}.${ext}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish all three firmware variants
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: release-assets
      - name: Checksums
        run: |
          cd release-assets
          sha256sum -- *.uf2 *.elf *.bin > SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }} — USB / Bluetooth Pico 2 W / Waveshare
          generate_release_notes: true
          body: |
            ### 固件下载
            - **usb-pico2.uf2**：Pico 2，GPIO12/13 PIO-USB 输入，支持键鼠 / HID / XInput / Switch Pro。
            - **bluetooth-pico2w.uf2**：Pico 2 W 板载经典蓝牙输入，支持 DualSense / DualSense Edge；不启用 PIO-USB Host。
            - **bluetooth-waveshare-rp2350b-plus-w.uf2**：Waveshare RP2350B-Plus-W（RP2350B + RM2，16 MiB Flash）蓝牙版，同样支持 DualSense / Edge。

            两个蓝牙板型的无线引脚与 Flash 容量不同，UF2 不可混刷。

            蓝牙版：手柄关机后按住 **PS + Create** 直到快速闪烁，等待对应无线板自动配对；成功后板载 LED 常亮。配对密钥独立存储，重启后按 PS 重连。上板兼容性仍需实际设备验证。

            三版都通过原生 USB 输出 DS5，保留 Lua、BOOT 启用 WinUSB、网页编辑与 AI 配置功能。请按硬件选择 UF2；ELF/BIN 用于调试，SHA256SUMS 用于校验。

            [网页工作台](https://riderlty.github.io/pico-ds5-coventer/) · [蓝牙说明](https://github.com/RiderLty/pico-ds5-coventer/blob/main/docs/bluetooth.md)
          fail_on_unmatched_files: true
          files: release-assets/*
